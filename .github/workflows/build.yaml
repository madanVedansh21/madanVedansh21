name: Update GitHub Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:       # manual trigger from GitHub Actions tab

# Prevent race conditions if multiple pushes happen in quick succession
concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to push the updated SVGs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for clean rebase

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r cache/requirements.txt

      - name: Update stats in SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit and push updated SVGs
        run: |
          git config --global user.email "github-actions-bot@users.noreply.github.com"
          git config --global user.name  "madanVedansh21/GitHub-Actions-Bot"
          git add dark_mode.svg light_mode.svg cache/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update GitHub stats [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
